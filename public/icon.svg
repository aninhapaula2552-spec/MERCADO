<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Shopping Basket Icon -->
  <g filter="url(#shadow)" transform="translate(0, -18)">
    <!-- Basket Handles -->
    <path d="M172 180 C172 120, 210 100, 256 100 C302 100, 340 120, 340 180" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Basket Body -->
    <path d="M136 180 h240 l-30 170 c-4 22 -22 38 -45 38 h-110 c-23 0 -41 -16 -45 -38 z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
    
    <!-- Basket Grid Holes -->
    <rect x="176" y="215" width="40" height="40" rx="8" fill="#ffffff" opacity="0.92"/>
    <rect x="236" y="215" width="40" height="40" rx="8" fill="#ffffff" opacity="0.92"/>
    <rect x="296" y="215" width="40" height="40" rx="8" fill="#ffffff" opacity="0.92"/>
    <rect x="192" y="275" width="40" height="40" rx="8" fill="#ffffff" opacity="0.92"/>
    <rect x="280" y="275" width="40" height="40" rx="8" fill="#ffffff" opacity="0.92"/>
  </g>
  
  <!-- App Name Text "Mercado Fresh" -->
  <text x="256" y="425" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-0.5">Mercado Fresh</text>
</svg>
